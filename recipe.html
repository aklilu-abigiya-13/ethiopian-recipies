<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ethiopian Recipes 🇪🇹</title>
  <style>
    :root {
      --bg: #fdf6ec; --surface: #ffffff; --border: #f5d9b0;
      --text: #2d2d2d; --muted: #888; --accent: #c0440a;
      --accent2: #e8890a; --dark: #7b2d00; --nav-bg: #fff8f0;
      --card-shadow: 0 4px 16px rgba(0,0,0,0.09);
      --input-bg: #ffffff;
    }
    [data-theme="dark"] {
      --bg: #1a1208; --surface: #2a1e0f; --border: #4a3520;
      --text: #f0e0c8; --muted: #a08060; --accent: #e8890a;
      --accent2: #ffb347; --dark: #ffb347; --nav-bg: #231708;
      --card-shadow: 0 4px 16px rgba(0,0,0,0.4);
      --input-bg: #2a1e0f;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:var(--bg); color:var(--text); transition:background 0.3s,color 0.3s; }

    /* HEADER */
    header { background:linear-gradient(135deg,#7b2d00 0%,#c0440a 60%,#e8890a 100%); color:white; padding:40px 20px 30px; text-align:center; position:relative; }
    header .flag { font-size:2.2rem; margin-bottom:8px; }
    header h1 { font-size:2.2rem; font-weight:800; }
    header p { margin-top:6px; font-size:1rem; opacity:0.88; }
    .header-btns { position:absolute; top:16px; right:20px; display:flex; gap:10px; }
    .icon-btn { background:rgba(255,255,255,0.15); border:none; border-radius:50%; width:40px; height:40px; font-size:1.1rem; cursor:pointer; color:white; display:flex; align-items:center; justify-content:center; transition:background 0.2s; }
    .icon-btn:hover { background:rgba(255,255,255,0.3); }

    /* CONTROLS */
    .controls { background:var(--nav-bg); border-bottom:2px solid var(--border); padding:16px 20px; }
    .search-row { max-width:1150px; margin:0 auto 14px; display:flex; gap:10px; }
    #searchInput {
      flex:1; padding:11px 18px; font-size:0.95rem; border:2px solid var(--border);
      border-radius:12px; outline:none; background:var(--input-bg); color:var(--text);
      transition:border-color 0.2s;
    }
    #searchInput:focus { border-color:var(--accent); }
    .filter-row { max-width:1150px; margin:0 auto; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .filter-btn {
      padding:7px 16px; border:2px solid var(--accent); border-radius:24px;
      background:var(--surface); color:var(--accent); font-size:0.82rem; font-weight:600;
      cursor:pointer; transition:all 0.2s;
    }
    .filter-btn:hover, .filter-btn.active { background:var(--accent); color:white; }
    .fasting-btn { border-color:#2d6a2d; color:#2d6a2d; }
    .fasting-btn:hover, .fasting-btn.active { background:#2d6a2d; color:white; }
    .stats { max-width:1150px; margin:10px auto 0; font-size:0.85rem; color:var(--muted); }

    /* GRID */
    main { max-width:1150px; margin:28px auto 60px; padding:0 20px; }
    .card-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:22px; }

    /* CARD */
    .card {
      background:var(--surface); border-radius:16px; overflow:hidden;
      box-shadow:var(--card-shadow); cursor:pointer; display:flex; flex-direction:column;
      transition:transform 0.2s,box-shadow 0.2s;
      opacity:0; transform:translateY(20px); animation:fadeUp 0.4s forwards;
    }
    @keyframes fadeUp { to { opacity:1; transform:translateY(0); } }
    .card:hover { transform:translateY(-6px); box-shadow:0 14px 32px rgba(0,0,0,0.15); }
    .card-banner { height:10px; background:linear-gradient(90deg,#7b2d00,#e8890a); }
    .card-body { padding:18px 18px 12px; flex:1; display:flex; flex-direction:column; gap:10px; }
    .card-top { display:flex; justify-content:space-between; align-items:flex-start; }

    .tag { display:inline-block; padding:4px 11px; border-radius:14px; font-size:0.7rem; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
    .tag-stew      { background:#fff0e0; color:#c0440a; }
    .tag-bread     { background:#fef9e7; color:#b7770d; }
    .tag-breakfast { background:#e8f8e8; color:#2d6a2d; }
    .tag-porridge  { background:#f5eef8; color:#7d3c98; }
    .tag-snack     { background:#fde8f0; color:#b03060; }
    .tag-grain     { background:#f0ece0; color:#7a5c1e; }
    .tag-salad     { background:#eafaf1; color:#1a7a4a; }
    .tag-drink     { background:#eaf4fb; color:#1a5276; }
    [data-theme="dark"] .tag-stew      { background:#3a1a00; color:#ffb380; }
    [data-theme="dark"] .tag-bread     { background:#2a2000; color:#ffd080; }
    [data-theme="dark"] .tag-breakfast { background:#0a2010; color:#80d080; }
    [data-theme="dark"] .tag-porridge  { background:#1e0a2a; color:#d080ff; }
    [data-theme="dark"] .tag-snack     { background:#2a0a18; color:#ff80b0; }
    [data-theme="dark"] .tag-grain     { background:#1e1800; color:#c0a060; }
    [data-theme="dark"] .tag-salad     { background:#0a1e12; color:#60c080; }
    [data-theme="dark"] .tag-drink     { background:#0a1828; color:#80c0ff; }

    .heart-btn { background:none; border:none; font-size:1.3rem; cursor:pointer; line-height:1; padding:0; transition:transform 0.15s; flex-shrink:0; }
    .heart-btn:hover { transform:scale(1.25); }
    .heart-btn.fav { color:#e53e3e; }
    .heart-btn:not(.fav) { color:#ccc; }

    .food-img { width:100%; height:160px; object-fit:cover; border-radius:10px; background:#f0e0c8; display:flex; align-items:center; justify-content:center; font-size:3.5rem; overflow:hidden; }
    .food-img img { width:100%; height:100%; object-fit:cover; border-radius:10px; }
    .food-emoji { width:100%; height:160px; border-radius:10px; background:linear-gradient(135deg,#fff0e0,#fdf6ec); display:flex; align-items:center; justify-content:center; font-size:4rem; }
    [data-theme="dark"] .food-emoji { background:linear-gradient(135deg,#2a1e0f,#1a1208); }

    .card h2 { font-size:1.1rem; color:var(--dark); line-height:1.4; }
    .card .amharic { font-size:0.85rem; color:var(--accent); font-style:italic; }
    .card .description { font-size:0.83rem; color:var(--muted); line-height:1.6; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

    .calorie-bar { display:flex; align-items:center; gap:8px; }
    .cal-track { flex:1; height:7px; background:var(--border); border-radius:10px; overflow:hidden; }
    .cal-fill { height:100%; border-radius:10px; background:linear-gradient(90deg,#c0440a,#e8890a); }
    .cal-label { font-size:0.78rem; font-weight:700; color:var(--accent); white-space:nowrap; }

    .fasting-badge { display:inline-block; background:#e8f8e8; color:#2d6a2d; font-size:0.68rem; font-weight:700; padding:2px 8px; border-radius:10px; }
    [data-theme="dark"] .fasting-badge { background:#0a2010; color:#80d080; }

    .card-footer { padding:10px 18px; background:var(--nav-bg); border-top:1px solid var(--border); font-size:0.78rem; color:var(--muted); display:flex; justify-content:space-between; align-items:center; }
    .view-btn { background:var(--accent); color:white; border:none; padding:5px 14px; border-radius:8px; font-size:0.78rem; cursor:pointer; font-weight:600; transition:background 0.2s; }
    .view-btn:hover { background:var(--dark); }

    .no-results { text-align:center; color:var(--muted); padding:60px 20px; font-size:1rem; grid-column:1/-1; }

    footer { text-align:center; padding:24px; background:#7b2d00; color:rgba(255,255,255,0.75); font-size:0.85rem; }
    footer strong { color:white; }

    @media(max-width:600px) {
      header h1 { font-size:1.5rem; }
      .card-grid { grid-template-columns:1fr; }
    }
  </style>
</head>

let currentCat = 'all';
let fastingOnly = false;
let favOnly = false;
let favorites = JSON.parse(localStorage.getItem('ethFavs') || '[]');

function saveFavs() { localStorage.setItem('ethFavs', JSON.stringify(favorites)); }

function toggleFav(id, e) {
  e.stopPropagation();
  if (favorites.includes(id)) favorites = favorites.filter(f => f !== id);
  else favorites.push(id);
  saveFavs();
  applyFilters();
}

function setCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.filter-btn[data-cat]').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyFilters();
}

function toggleFasting(btn) {
  fastingOnly = !fastingOnly;
  btn.classList.toggle('active', fastingOnly);
  applyFilters();
}

function toggleFavFilter(btn) {
  favOnly = !favOnly;
  btn.classList.toggle('active', favOnly);
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  let list = recipes;
  if (currentCat !== 'all') list = list.filter(r => r.category === currentCat);
  if (fastingOnly) list = list.filter(r => r.fasting);
  if (favOnly) list = list.filter(r => favorites.includes(r.id));
  if (q) list = list.filter(r => r.name.toLowerCase().includes(q) || r.amharic.includes(q) || r.description.toLowerCase().includes(q));
  document.getElementById('stats').textContent = `Showing ${list.length} of ${recipes.length} recipes`;
  renderCards(list);
}

function renderCards(list) {
  const grid = document.getElementById('recipe-grid');
  if (list.length === 0) {
    grid.innerHTML = `<div class="no-results">😕 No recipes found. Try a different search or filter.</div>`;
    return;
  }
  grid.innerHTML = list.map((r, i) => {
    const pct = Math.min(100, Math.round((r.calories / 600) * 100));
    const isFav = favorites.includes(r.id);
    return `
      <div class="card" style="animation-delay:${i * 0.05}s" onclick="goToDetail(${r.id})">
        <div class="card-banner"></div>
        <div class="card-body">
          <div class="card-top">
            <span class="tag ${r.tagClass}">${r.tagLabel}</span>
            <button class="heart-btn ${isFav ? 'fav' : ''}" onclick="toggleFav(${r.id}, event)" title="${isFav ? 'Remove from favorites' : 'Add to favorites'}">${isFav ? '❤️' : '🤍'}</button>
          </div>
          <div class="food-emoji">${r.emoji}</div>
          <h2>${r.name}</h2>
          <div class="amharic">${r.amharic}</div>
          <p class="description">${r.description}</p>
          <div class="calorie-bar">
            <span>🔥</span>
            <div class="cal-track"><div class="cal-fill" style="width:${pct}%"></div></div>
            <span class="cal-label">${r.calRange}</span>
          </div>
          ${r.fasting ? '<span class="fasting-badge">🌿 Fasting Friendly</span>' : ''}
        </div>
        <div class="card-footer">
          <span>${r.ingredients.length} ingredients</span>
          <button class="view-btn">View Recipe →</button>
        </div>
      </div>`;
  }).join('');
}

function goToDetail(id) {
  window.location.href = `recipe-detail.html?id=${id}`;
}

function toggleDark() {
  const html = document.documentElement;
  const isDark = html.getAttribute('data-theme') === 'dark';
  html.setAttribute('data-theme', isDark ? 'light' : 'dark');
  document.getElementById('darkToggle').textContent = isDark ? '🌙' : '☀️';
  localStorage.setItem('ethTheme', isDark ? 'light' : 'dark');
}

// Restore theme
const savedTheme = localStorage.getItem('ethTheme');
if (savedTheme) {
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('darkToggle').textContent = savedTheme === 'dark' ? '☀️' : '🌙';
}

applyFilters();
</script>
